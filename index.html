<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AE 內建特效圖鑑｜中英對照動態預覽</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#141518;--panel:#1d1f23;--panel2:#25282d;--line:#33373d;--txt:#dde0e5;--mute:#8d939c;
  --ae:#4ea4f2;--sel:#21364f;--hot:#f2a640;--r:8px;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"JetBrains Mono","SFMono-Regular",Consolas,"Noto Sans TC",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{overflow-y:scroll;scrollbar-gutter:stable}
html,body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.6 var(--body);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ae);outline-offset:2px}
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.wrap{max-width:1400px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;gap:12px;padding:10px 0;min-height:55px;flex-wrap:wrap}
.logo{display:flex;align-items:baseline;gap:10px;min-width:0}
.logo b{font:700 16px var(--body);white-space:nowrap}
.logo small{color:var(--mute);font-size:12px;white-space:nowrap}
.grow{flex:1}
.htip{color:var(--mute);font-size:12px;white-space:nowrap;text-align:right}
.search{position:relative;width:min(360px,100%)}
.search input{width:100%;height:34px;padding:0 12px 0 32px;border-radius:7px;border:1px solid var(--line);background:var(--bg);outline:none}
.search input:focus{border-color:var(--ae)}
.search svg{position:absolute;left:10px;top:9px;width:16px;height:16px;stroke:var(--mute)}
.toggles{display:flex;gap:8px}
.tg{height:34px;padding:0 12px;border:1px solid var(--line);border-radius:7px;background:var(--panel2);font-size:13px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.tg:hover{border-color:#4a4f57}
.tg.on{color:var(--ae);border-color:#2c4e72;background:#182637}
.tg.hoton{color:var(--hot);border-color:#5b4521;background:#2d2416}
.catbar{display:flex;align-items:center;gap:6px}
.cats{flex:1;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;scroll-behavior:smooth}
.cats::-webkit-scrollbar{display:none}
.arrow{flex:none;width:28px;height:28px;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--panel2);color:var(--mute);display:flex;align-items:center;justify-content:center}
.arrow svg{display:block;flex:none}
.arrow:hover{border-color:var(--ae);color:var(--ae)}
.arrow:disabled{opacity:.35;cursor:default;border-color:var(--line);color:var(--mute)}
.catrange{display:block;width:100%;margin:6px 0 8px;height:14px;-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer}
.catrange::-webkit-slider-runnable-track{height:6px;background:var(--bg);border:1px solid var(--line);border-radius:4px}
.catrange::-moz-range-track{height:6px;background:var(--bg);border:1px solid var(--line);border-radius:4px}
.catrange::-webkit-slider-thumb{-webkit-appearance:none;width:var(--tw,120px);height:6px;margin-top:-1px;border-radius:4px;background:#4a4f57}
.catrange::-moz-range-thumb{width:var(--tw,120px);height:6px;border:0;border-radius:4px;background:#4a4f57}
.catrange:hover::-webkit-slider-thumb{background:var(--ae)}
.catrange:hover::-moz-range-thumb{background:var(--ae)}
.catrange.hide{visibility:hidden;height:0;margin:0 0 8px}
.cats .chip{flex:none;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:3px 10px;font-size:13px;color:var(--txt)}
.chip span{font:11px var(--mono);color:var(--mute);background:var(--bg);padding:0 6px;border-radius:10px}
.chip:hover{border-color:#4a4f57}
.chip.on{background:var(--sel);border-color:#2c4e72}
.chip.on::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--hot);transform:rotate(45deg)}
.tipm{}@media (hover:none){.tipm{display:none}}
.meta{display:flex;justify-content:space-between;align-items:center;color:var(--mute);font-size:12.5px;padding:14px 0 0;flex-wrap:wrap;gap:8px}

section.cat{margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
section.cat h2{display:flex;align-items:center;gap:8px;margin:0;padding:8px 12px;min-height:40px;border-bottom:1px solid var(--line);font:600 14px var(--body)}
section.cat h2 em{font:12px var(--mono);font-style:normal;color:var(--mute)}
section.cat h2 i{margin-left:auto;font:11px var(--mono);font-style:normal;color:var(--mute);background:var(--panel2);padding:1px 8px;border-radius:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;padding:12px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:border-color .15s,background .15s;display:flex;flex-direction:column}
@media (hover:hover){.card:hover{border-color:var(--ae);background:#272b31}}
.cv{position:relative;aspect-ratio:16/9;background:#0c0d0f;
  background-image:conic-gradient(#24262b 25%,#1b1c20 0 50%,#24262b 0 75%,#1b1c20 0);background-size:14px 14px}
.cv canvas{width:100%;height:100%;display:block}
.cv .badge{position:absolute;left:6px;top:6px;font:600 10px var(--mono);background:rgba(20,21,24,.8);border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--mute)}
.fav{position:absolute;right:5px;top:5px;width:26px;height:26px;padding:0;border-radius:6px;border:1px solid transparent;background:rgba(20,21,24,.75);color:#c9ccd2;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s}
.ico{width:15px;height:15px;display:block;flex:none}
.btn,.tg{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.fav.on{opacity:1}
@media (hover:hover){.card:hover .fav{opacity:1}}
@media (hover:none){.fav{opacity:.85}.cv .play{display:none}}
.fav:hover{border-color:#5b4521;color:var(--hot)}
.fav.on{color:var(--hot);border-color:#5b4521;background:#2d2416}
.btn.favon{color:var(--ae);border-color:#2c4e72;background:#182637}
.tg .n{font:11px var(--mono);background:var(--bg);padding:0 6px;border-radius:10px;color:var(--mute)}
.tg.hoton .n{color:var(--hot)}
.cv .play{position:absolute;right:6px;bottom:6px;font-size:10.5px;background:rgba(20,21,24,.8);border-radius:4px;padding:0 6px;color:var(--mute)}
@media (hover:hover){.card:hover .play{opacity:0}}
.info{padding:9px 11px 11px;display:flex;flex-direction:column;gap:1px;flex:1}
.en{font:600 13px var(--mono);color:var(--txt);overflow-wrap:anywhere}
.zh{font-size:14px;color:var(--hot)}
.desc{font-size:12.5px;color:var(--mute);line-height:1.6;margin-top:4px}
.empty{padding:60px 0;text-align:center;color:var(--mute)}
mark{background:#5b4521;color:#fff;border-radius:3px;padding:0 1px}
footer .mob{display:none}
footer{color:var(--mute);font-size:8px;text-align:center;padding:32px 20px 44px;line-height:1.8}
.mask{position:fixed;inset:0;background:rgba(8,9,10,.75);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
.mask.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);width:min(980px,100%);max-height:94vh;overflow:auto;display:grid;grid-template-columns:1.6fr 1fr;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal .big{background:#0c0d0f;background-image:conic-gradient(#24262b 25%,#1b1c20 0 50%,#24262b 0 75%,#1b1c20 0);background-size:16px 16px;aspect-ratio:16/9;align-self:start;border-right:1px solid var(--line)}
.modal .big canvas{width:100%;height:100%;display:block}
.mside{position:relative;min-width:0}
.msin{position:absolute;inset:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.mside .path{font:12px var(--mono);color:var(--mute)}
.mside h3{margin:0;font:600 19px var(--mono);padding-right:28px}
.mside .mzh{font-size:17px;color:var(--hot)}
.note{display:none;margin-top:4px;padding:9px 11px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);font-size:12.5px;line-height:1.65;color:var(--txt)}
.note b{display:inline-flex;align-items:center;gap:6px;font-size:12px;margin-bottom:3px;font-weight:600}
.note b::before{content:"";width:8px;height:8px;border-radius:2px}
.note span{display:block;color:#c3c7ce}
.note.solid{border-color:#2c4e72;background:#182637}.note.solid b{color:var(--ae)}.note.solid b::before{background:var(--ae)}
.note.null{border-color:#5b4521;background:#2d2416}.note.null b{color:var(--hot)}.note.null b::before{border:1.5px solid var(--hot);border-radius:1px;background:none;width:7px;height:7px}
.mside p{margin:0;font-size:14px;line-height:1.7;color:var(--txt)}
.ctrl{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--line);flex-wrap:wrap}
.ctrl label{font-size:12.5px;color:var(--mute)}
.ctrl input[type=range]{flex:1;min-width:140px;accent-color:var(--ae)}
.btn{height:32px;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:0 12px;font-size:13px}
.btn:hover{border-color:#4a4f57}
.btn.pri{color:var(--ae);border-color:#2c4e72;background:#182637}
.row{display:flex;gap:8px;flex-wrap:wrap}
.x{position:absolute;top:10px;right:12px;font-size:22px;background:none;border:none;color:var(--mute)}
.x:hover{color:var(--txt)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--panel2);border:1px solid #2c4e72;color:var(--ae);padding:6px 14px;border-radius:7px;font-size:13px;opacity:0;transition:.2s;z-index:80;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
@media (max-width:720px){footer{padding-left:6px;padding-right:6px;-webkit-text-size-adjust:100%;text-size-adjust:100%}footer .dsk{display:none}footer .mob{display:inline}.fl1{white-space:nowrap;font-size:min(8px,2.02vw);letter-spacing:-.1px}.mside{height:var(--msh,318px)}.msin{padding:12px 14px;gap:6px}.mside .row{flex-wrap:nowrap;gap:6px}.mside .row .btn{padding:0 9px;font-size:12.5px;white-space:nowrap}.ctrl{padding:8px 10px;gap:8px}.mask{align-items:flex-start;padding-top:max(41px,env(safe-area-inset-top))}.toggles{width:100%}.toggles .tg{flex:1;justify-content:center}.modal{grid-template-columns:1fr}.modal .big{border-right:0}.search{width:100%}.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;padding:8px}}
@media (min-width:721px) and (max-width:900px){.modal{grid-template-columns:1fr;width:min(640px,100%)}.modal .big{border-right:0;border-bottom:1px solid var(--line)}.mside{height:292px}.toggles{flex:1;min-width:280px}.toggles .tg{flex:1;justify-content:center}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div class="logo"><b>AE 內建特效圖鑑</b></div>
      <div class="grow"></div>
      <div class="htip">點擊卡片可放大查看效果</div>
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="q" placeholder="搜尋中文或英文名稱，例如：模糊、glow、轉場…" autocomplete="off">
      </div>
      <div class="toggles">
        <button class="tg" id="hotBtn"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l2.83 5.73 6.32.92-4.57 4.46 1.08 6.3L12 17.24l-5.66 2.97 1.08-6.3-4.57-4.46 6.32-.92z" fill="currentColor"/></svg>我的收藏 <span class="n" id="favN">0</span></button>
        <button class="tg" id="autoBtn">▶ 自動播放</button>
      </div>
    </div>
    <div class="catbar"><button class="arrow" id="catL" aria-label="向左"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><nav class="cats" id="cats"></nav><button class="arrow" id="catR" aria-label="向右"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button></div>
    <input type="range" class="catrange" id="catRange" min="0" max="1000" value="0" aria-label="左右查看分類">
  </div>
</header>

<main class="wrap">
  <div id="list"></div>
</main>

<footer>
  <span class="fl1">預覽畫面皆為網頁即時運算的示意動畫，用來表達特效的「呈現方式」，與 AE 實際算繪結果會有差異。</span><br>
  中文名稱以繁體中文版 AE 的常見譯名為主，不同版本的翻譯可能略有出入<span class="dsk">；</span><span class="mob">。<br></span>英文名稱可直接貼到「效果和預設集」面板搜尋。<br>
  CC 開頭的特效為 AE 內建的 Cycore 外掛。
</footer>

<div class="mask" id="mask">
  <div class="modal" style="position:relative">
    <div class="big"><canvas id="bigcv" width="640" height="360"></canvas></div>
    <div class="mside"><div class="msin">
      <div class="path" id="mPath"></div>
      <h3 id="mEn"></h3>
      <div class="mzh" id="mZh"></div>
      <p id="mDesc"></p>
      <div class="note" id="mNote"></div>
      <div class="row" style="margin-top:auto">
        <button class="btn" id="copyEn">複製英文名稱</button>
        <button class="btn" id="copyZh">複製中文名稱</button>
        <button class="btn" id="mFav">☆ 加入收藏</button>
      </div>
    </div></div>
    <div class="ctrl">
      <button class="btn" id="mPlay">⏸ 暫停</button>
      <label for="amt">強度 / 進度</label>
      <input type="range" id="amt" min="0" max="1" step="0.01" value="0.7">
      <button class="btn" id="mAuto">自動來回</button>
      <span style="flex:1"></span>
      <button class="btn" id="prev">← 上一個</button>
      <button class="btn" id="next">下一個 →</button>
    </div>
    <button class="x" id="close" aria-label="關閉">×</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   資料
   ========================================================= */
const CATS = [
  ['ch3d','3D 色版','3D Channel'],
  ['audio','音訊','Audio'],
  ['blur','模糊和銳利化','Blur & Sharpen'],
  ['mocha','Boris FX Mocha','Boris FX Mocha'],
  ['channel','色版','Channel'],
  ['c4d','CINEMA 4D','CINEMA 4D'],
  ['color','色彩校正','Color Correction'],
  ['distort','扭曲','Distort'],
  ['expr','表達式控制','Expression Controls'],
  ['gen','生成','Generate'],
  ['vr','沉浸式視訊','Immersive Video'],
  ['key','去背','Keying'],
  ['matte','遮色片','Matte'],
  ['noise','雜訊與顆粒','Noise & Grain'],
  ['old','舊版','Obsolete'],
  ['persp','透視','Perspective'],
  ['sim','模擬','Simulation'],
  ['style','風格化','Stylize'],
  ['text','文字','Text'],
  ['time','時間','Time'],
  ['trans','轉場','Transition'],
  ['util','公用程式','Utility'],
];
// [分類, 英文, 中文, 說明, 預覽key, 參數, 常用]
const FX = [
// 模糊和銳利化
['blur','Bilateral Blur','雙邊模糊','平滑畫面但保留邊緣，適合柔膚、降噪而不糊掉輪廓。','bilateral',8],
['blur','Camera Lens Blur','攝影機鏡頭模糊','模擬真實鏡頭景深，亮點會變成光圈形狀的散景。','bokeh',0,1],
['blur','Camera-Shake Deblur','攝影機震動去模糊','減少手持晃動造成的動態模糊，讓畫面變得清楚。','deblur'],
['blur','CC Cross Blur','CC 十字模糊','分別控制水平與垂直方向的模糊量，形成十字狀柔化。','crossblur'],
['blur','CC Radial Blur','CC 放射狀模糊','以中心點產生旋轉或縮放式的模糊，可做衝擊感。','spinblur'],
['blur','CC Radial Fast Blur','CC 快速放射狀模糊','快速的放射狀縮放模糊，常拿來做光芒爆發、速度感。','zoomblur'],
['blur','CC Vector Blur','CC 向量模糊','依圖層亮度決定模糊方向，產生流動般的筆刷感。','vectorblur'],
['blur','Channel Blur','色版模糊','可分別對紅、綠、藍與 Alpha 色版做不同程度的模糊。','channelblur'],
['blur','Compound Blur','複合模糊','依另一個圖層的亮度決定模糊程度，可做局部景深。','compound'],
['blur','Directional Blur','方向模糊','沿指定角度產生模糊，最常用來做速度感與殘影。','dirblur',0,1],
['blur','Fast Box Blur','快速方框模糊','運算很快的模糊，可重複次數讓效果更柔順。','blur',8,1],
['blur','Gaussian Blur','高斯模糊','最基本、最常用的柔和均勻模糊。','blur',8,1],
['blur','Radial Blur','放射狀模糊','舊版放射狀模糊，提供旋轉與縮放兩種模式。','zoomblur'],
['old','Reduce Interlace Flicker','減少交錯閃爍','輕微的垂直模糊，降低細橫線在電視上閃爍的問題。','blurV'],
['blur','Sharpen','銳利化','加強相鄰像素的對比，讓畫面看起來更清晰。','sharpen',1.5,1],
['blur','Smart Blur','智慧型模糊','只模糊平滑區域、保留邊緣，有點像磨皮。','bilateral',5],
['blur','Unsharp Mask','遮色片銳利化調整','以半徑與臨界值控制的進階銳利化。','sharpen',1.2],
// 色版
['channel','Arithmetic','算術','以數學運算（加、減、AND、XOR…）修改各色版數值。','arith'],
['channel','Blend','混合','把另一個圖層以指定模式混合到目前圖層上。','blend'],
['channel','Calculations','計算','將兩個圖層的色版以混合模式運算，常用來萃取色版。','calc'],
['channel','CC Composite','CC 合成','把圖層和自己以混合模式疊加，快速加亮或加深。','selfcomp'],
['channel','Channel Combiner','色版組合器','在 RGB、HLS、YUV 等色彩空間之間轉換或交換色版。','swap',[2,0,1]],
['channel','Compound Arithmetic','複合算術','把另一圖層與目前圖層做算術運算後合成。','arith'],
['channel','Invert','反轉','反轉色彩，產生負片效果，也可只反轉單一色版。','invert',0,1],
['channel','Minimax','最小最大值','以周圍最大或最小值取代像素，可擴張或收縮亮區。','minimax'],
['channel','Remove Color Matting','移除顏色遮色片','移除預乘 Alpha 邊緣殘留的背景色暈。','unmatte'],
['channel','Set Channels','設定色版','從其他圖層取用 R、G、B、A 色版重新組合。','swap',[1,2,0]],
['channel','Set Matte','設定遮色片','把另一個圖層的色版當作目前圖層的 Alpha。','setmatte',0,1],
['channel','Shift Channels','移動色版','把某色版的資料換成另一個色版，產生奇特配色。','swap',[2,1,0]],
['channel','Solid Composite','純色合成','在圖層後方快速墊一層純色背景。','solidcomp'],
// 色彩校正
['color','Auto Color','自動色彩','自動分析並修正偏色與對比。','autolevels'],

function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function vnoise(x,y){const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy;
  const h=(a,b)=>rnd(a*57+b*131);const ux=fx*fx*(3-2*fx),uy=fy*fy*(3-2*fy);
  return lerp(lerp(h(ix,iy),h(ix+1,iy),ux),lerp(h(ix,iy+1),h(ix+1,iy+1),ux),uy)}
function fbm(x,y,o=4){let v=0,a=.5;for(let i=0;i<o;i++){v+=a*vnoise(x,y);x*=2;y*=2;a*=.5}return v/(1-Math.pow(.5,o))}

// ---- 素材 ----
const DRAW={
  A(x){ // 白天風景
    let g=x.createLinearGradient(0,0,0,108);g.addColorStop(0,'#1d4f9c');g.addColorStop(.55,'#78ade6');g.addColorStop(1,'#f5c27c');
    x.fillStyle=g;x.fillRect(0,0,192,108);
    x.fillStyle='#ffe27a';x.beginPath();x.arc(152,28,12,0,TAU);x.fill();
    x.fillStyle='#fff6';x.beginPath();x.ellipse(60,22,18,6,0,0,TAU);x.ellipse(74,18,12,6,0,0,TAU);x.fill();
    x.fillStyle='#3a4870';x.beginPath();x.moveTo(0,80);x.lineTo(42,46);x.lineTo(72,68);x.lineTo(108,40);x.lineTo(150,74);x.lineTo(192,56);x.lineTo(192,108);x.lineTo(0,108);x.fill();
    x.fillStyle='#2f7d4f';x.fillRect(0,86,192,22);
  },
  B(x){ // 夜景（簡化版）：漸層夜空＋月亮＋一排大樓
    let g=x.createLinearGradient(0,0,0,108);g.addColorStop(0,'#0a0d2e');g.addColorStop(.55,'#3b1f6e');g.addColorStop(1,'#e0607e');
    x.fillStyle=g;x.fillRect(0,0,192,108);
    for(let i=0;i<18;i++){x.fillStyle=`rgba(255,255,255,${.5+rnd(i)*.5})`;x.beginPath();x.arc(rnd(i+3)*192,rnd(i+9)*48,.8,0,TAU);x.fill()}
    let mg=x.createRadialGradient(140,30,10,140,30,30);mg.addColorStop(0,'rgba(255,240,200,.35)');mg.addColorStop(1,'rgba(255,240,200,0)');x.fillStyle=mg;x.fillRect(100,0,80,64);
    x.fillStyle='#fff6dc';x.beginPath();x.arc(140,30,13,0,TAU);x.fill();
    const B=[[8,30,34],[46,26,50],[80,34,28],[124,28,42],[160,26,30]];
    B.forEach(([bx,bw,bh],i)=>{x.fillStyle='#0d0a1e';x.fillRect(bx,108-bh,bw,bh);
      x.fillStyle='#ffd36b';for(let r=0;r<Math.floor((bh-8)/12);r++)for(let c=0;c<2;c++)if(rnd(i*31+r*7+c)>.35)x.fillRect(bx+bw/2-8+c*11,108-bh+7+r*12,5,6)});
  },
  G(x){ // 綠幕＋紅黃藍圓形
    let g=x.createRadialGradient(96,54,10,96,54,110);g.addColorStop(0,'#2ad35c');g.addColorStop(1,'#11953a');
    x.fillStyle=g;x.fillRect(0,0,192,108);
    [['#e53e3e',40],['#f6c331',96],['#3b82f6',152]].forEach(([c,cx])=>{x.beginPath();x.arc(cx,56,20,0,TAU);x.fillStyle=c;x.fill();x.strokeStyle='rgba(120,230,120,.55)';x.lineWidth=2;x.stroke()});
  },
  L(x){ // 透明 Logo
    x.font='900 46px "Arial Black",Arial,sans-serif';x.textAlign='center';x.textBaseline='middle';
    x.fillStyle='#ff8a3d';x.fillText('Ae',84,56);
    x.fillStyle='#5ab0ff';x.beginPath();x.arc(144,56,16,0,TAU);x.fill();
  },
};
const SRC={};
function src(kind,w,h){const k=kind+w;if(SRC[k])return SRC[k];const c=mk(w,h),x=c.getContext('2d',{willReadFrequently:true});
  x.save();x.scale(w/192,h/108);DRAW[kind](x);x.restore();return SRC[k]={c,d:x.getImageData(0,0,w,h)}}
// 會動的素材（時間類）
function drawMove(x,w,h,tt){x.save();x.scale(w/192,h/108);
  let g=x.createLinearGradient(0,0,192,0);g.addColorStop(0,'#1a1a40');g.addColorStop(1,'#2d1a4a');x.fillStyle=g;x.fillRect(0,0,192,108);
  const px=96+70*Math.sin(tt*TAU),py=54+26*Math.sin(tt*TAU*2);
  x.fillStyle='#ff8a3d';x.beginPath();x.arc(px,py,13,0,TAU);x.fill();
  x.fillStyle='#5ab0ff';x.save();x.translate(96,54);x.rotate(tt*TAU);x.fillRect(-30,-4,60,8);x.restore();
  x.restore()}

// ---- 像素工具 ----
const BUF=new WeakMap();
function buf(ctx,w,h){let b=BUF.get(ctx);if(!b||b.width!==w){b=ctx.createImageData(w,h);BUF.set(ctx,b)}return b}
function sample(s,w,h,x,y,o,i){
  if(x<0)x=0;else if(x>w-1.001)x=w-1.001;if(y<0)y=0;else if(y>h-1.001)y=h-1.001;
  const x0=x|0,y0=y|0,fx=x-x0,fy=y-y0,a=(y0*w+x0)*4,b=a+4,c=a+w*4,d=c+4;
  for(let k=0;k<4;k++)o[i+k]=(s[a+k]*(1-fx)+s[b+k]*fx)*(1-fy)+(s[c+k]*(1-fx)+s[d+k]*fx)*fy}
function warp(ctx,w,h,S,fn,edge){const o=buf(ctx,w,h),od=o.data,sd=S.data,P=[0,0];
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4;P[0]=x;P[1]=y;
    if(fn(x,y,P)===false){od[i+3]=0;continue}
    let sx=P[0],sy=P[1];
    if(edge==='none'&&(sx<0||sx>w-1||sy<0||sy>h-1)){od[i+3]=0;continue}
    if(edge==='wrap'){sx=((sx%w)+w)%w;sy=((sy%h)+h)%h}
    if(edge==='mirror'){sx=Math.abs(sx)%(2*w);if(sx>=w)sx=2*w-sx-1;sy=Math.abs(sy)%(2*h);if(sy>=h)sy=2*h-sy-1}
    sample(sd,w,h,sx,sy,od,i)}
  ctx.putImageData(o,0,0)}
function cop(ctx,w,h,S,fn){const o=buf(ctx,w,h),od=o.data,sd=S.data,C=[0,0,0,0];
  for(let y=0,i=0;y<h;y++)for(let x=0;x<w;x++,i+=4){C[0]=sd[i];C[1]=sd[i+1];C[2]=sd[i+2];C[3]=sd[i+3];fn(C,x,y,i);
    od[i]=C[0];od[i+1]=C[1];od[i+2]=C[2];od[i+3]=C[3]}
  ctx.putImageData(o,0,0)}
function boxPass(s,t,w,h,r,horiz){const n=2*r+1;
  if(horiz){for(let y=0;y<h;y++)for(let c=0;c<4;c++){const row=y*w*4+c;let acc=0;
    for(let k=-r;k<=r;k++)acc+=s[row+clamp(k,0,w-1)*4];
    for(let x=0;x<w;x++){t[row+x*4]=acc/n;acc+=s[row+Math.min(x+r+1,w-1)*4]-s[row+Math.max(x-r,0)*4]}}}
  else{const st=w*4;for(let x=0;x<w;x++)for(let c=0;c<4;c++){const col=x*4+c;let acc=0;
    for(let k=-r;k<=r;k++)acc+=s[col+clamp(k,0,h-1)*st];
    for(let y=0;y<h;y++){t[col+y*st]=acc/n;acc+=s[col+Math.min(y+r+1,h-1)*st]-s[col+Math.max(y-r,0)*st]}}}}
function blurArr(d,w,h,r,mode){r=Math.round(r);const a=new Float32Array(d);if(r<1)return a;const b=new Float32Array(d.length);
  for(let p=0;p<3;p++){if(mode!=='v'){boxPass(a,b,w,h,r,true);a.set(b)}if(mode!=='h'){boxPass(a,b,w,h,r,false);a.set(b)}}return a}
function putArr(ctx,w,h,arr){const o=buf(ctx,w,h);o.data.set(arr);ctx.putImageData(o,0,0)}
function accum(ctx,w,h,S,n,fn){const o=buf(ctx,w,h),od=o.data,sd=S.data,P=[0,0],T=[0,0,0,0];
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4;let r=0,g=0,b=0,a=0;
    for(let j=0;j<n;j++){fn(x,y,j/(n-1||1),P);sample(sd,w,h,P[0],P[1],T,0);r+=T[0];g+=T[1];b+=T[2];a+=T[3]}
    od[i]=r/n;od[i+1]=g/n;od[i+2]=b/n;od[i+3]=a/n}
  ctx.putImageData(o,0,0)}
function conv(ctx,w,h,S,K,bias,mix,gray){const o=buf(ctx,w,h),od=o.data,sd=S.data;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4;
    for(let c=0;c<3;c++){let v=0,k=0;
      for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const j=(clamp(y+dy,0,h-1)*w+clamp(x+dx,0,w-1))*4;
        v+=(gray?lum(sd[j],sd[j+1],sd[j+2]):sd[j+c])*K[k++]}
      od[i+c]=lerp(sd[i+c],v+bias,mix)}
    od[i+3]=sd[i+3]}
  ctx.putImageData(o,0,0)}
function hueMat(deg){const a=deg*Math.PI/180,c=Math.cos(a),s=Math.sin(a);
  return[.213+c*.787-s*.213,.715-c*.715-s*.715,.072-c*.072+s*.928,.213-c*.213+s*.143,.715+c*.285+s*.140,.072-c*.072-s*.283,.213-c*.213-s*.787,.715-c*.715+s*.715,.072+c*.928+s*.072]}
function applyMat(C,M,k){const r=C[0],g=C[1],b=C[2];
  C[0]=lerp(r,M[0]*r+M[1]*g+M[2]*b,k);C[1]=lerp(g,M[3]*r+M[4]*g+M[5]*b,k);C[2]=lerp(b,M[6]*r+M[7]*g+M[8]*b,k)}
function hsl2rgb(h,s,l){h=fr(h);const f=n=>{const k=(n+h*12)%12;return l-s*Math.min(l,1-l)*Math.max(-1,Math.min(k-3,9-k,1))};return[f(0)*255,f(8)*255,f(4)*255]}
function rgbHue(r,g,b){const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;if(d<1)return[-1,0];let h;
  if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;return[fr(h/6),d/mx]}
const hex=c=>[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];
function grad3(v,a,b,c){const A=hex(a),B=hex(b),Cc=hex(c);return v<.5?A.map((x,i)=>lerp(x,B[i],v*2)):B.map((x,i)=>lerp(x,Cc[i],v*2-1))}
function bg(x,w,h,c='#15152a'){x.fillStyle=c;x.fillRect(0,0,w,h)}
function sc(x,w){x.setTransform(w/192,0,0,w/192,0,0)}
function reset(x){x.setTransform(1,0,0,1,0,0);x.globalAlpha=1;x.globalCompositeOperation='source-over';x.shadowBlur=0;x.shadowColor='transparent';x.filter='none';x.setLineDash([])}
function onTop(x,w,h,fn){const c=mk(w,h),cx=c.getContext('2d');fn(cx);x.drawImage(c,0,0)}

/* ---- 各特效預覽 ---- (x: ctx, w,h, k: 強度0~1, t: 時間0~1, p: 參數) */
const R={
  blur(x,w,h,k,t,p){const S=src('A',w,h);putArr(x,w,h,blurArr(S.d.data,w,h,k*p*w/192))},
  blurV(x,w,h,k){const S=src('A',w,h);putArr(x,w,h,blurArr(S.d.data,w,h,k*3*w/192,'v'))},
  bokeh(x,w,h,k){const S=src('A',w,h);putArr(x,w,h,blurArr(S.d.data,w,h,k*6*w/192));sc(x,w);x.globalCompositeOperation='lighter';
    [[152,28,'#ffe27a']].forEach(([cx,cy,c],i)=>{x.globalAlpha=k*.5;x.fillStyle=c;x.beginPath();
      for(let j=0;j<6;j++){const a=j/6*TAU,r=6+k*10;x.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r)}x.fill()});reset(x)},
  sharpen(x,w,h,k,t,p){const S=src('A',w,h),a=k*p*1.6;conv(x,w,h,S.d,[0,-a,0,-a,1+4*a,-a,0,-a,0],0,1)},
  crossblur(x,w,h,k){const S=src('A',w,h),L=k*24*w/192;accum(x,w,h,S.d,14,(X,Y,j,P)=>{const s=(j*2-1)*L;if(j<.5){P[0]=X+s*2;P[1]=Y}else{P[0]=X;P[1]=Y+(s-L)*.6}})},
  spinblur(x,w,h,k){const S=src('A',w,h),cx=w/2,cy=h/2;accum(x,w,h,S.d,14,(X,Y,j,P)=>{const a=(j-.5)*k*.5,c=Math.cos(a),s=Math.sin(a),dx=X-cx,dy=Y-cy;P[0]=cx+dx*c-dy*s;P[1]=cy+dx*s+dy*c})},
  zoomblur(x,w,h,k){const S=src('A',w,h),cx=w*.79,cy=h*.26;accum(x,w,h,S.d,14,(X,Y,j,P)=>{const f=1-j*k*.35;P[0]=cx+(X-cx)*f;P[1]=cy+(Y-cy)*f})},
  vectorblur(x,w,h,k){const S=src('A',w,h),L=k*14*w/192,key='vf'+w;if(!SRC[key]){const f=new Float32Array(w*h*2);for(let y=0;y<h;y++)for(let X=0;X<w;X++){const a=fbm(X/w*3,y/h*3,2)*TAU*1.5;f[(y*w+X)*2]=Math.cos(a);f[(y*w+X)*2+1]=Math.sin(a)}SRC[key]=f}
    const F=SRC[key];accum(x,w,h,S.d,10,(X,Y,j,P)=>{const q=(Y*w+X)*2,s=(j-.5)*L;P[0]=X+F[q]*s;P[1]=Y+F[q+1]*s})},
  dirblur(x,w,h,k){const S=src('A',w,h),L=k*36*w/192;accum(x,w,h,S.d,16,(X,Y,j,P)=>{P[0]=X+(j-.5)*L;P[1]=Y+(j-.5)*L*.15})},
  channelblur(x,w,h,k){const S=src('A',w,h),b=blurArr(S.d.data,w,h,k*10*w/192),d=S.d.data,o=new Float32Array(d);
    for(let i=0;i<d.length;i+=4){o[i]=b[i];o[i+2]=b[i+2]*.5+d[i+2]*.5}putArr(x,w,h,o)},
  compound(x,w,h,k){const S=src('A',w,h),b=blurArr(S.d.data,w,h,k*10*w/192),d=S.d.data,o=new Float32Array(d.length);
    for(let y=0;y<h;y++)for(let X=0;X<w;X++){const i=(y*w+X)*4,m=sstep(.25,.85,Math.hypot(X/w-.3,y/h-.6));for(let c=0;c<4;c++)o[i+c]=lerp(d[i+c],b[i+c],m)}putArr(x,w,h,o)},
  // 色版
  arith(x,w,h,k){const S=src('A',w,h),v=(k*200)|0;cop(x,w,h,S.d,C=>{C[0]=C[0]^v;C[2]=clamp(C[2]-v*.6,0,255)})},
  blend(x,w,h,k){const A=src('A',w,h).d.data,B=src('B',w,h).d.data;cop(x,w,h,src('A',w,h).d,(C,X,Y,i)=>{for(let c=0;c<3;c++)C[c]=lerp(C[c],Math.max(A[i+c],B[i+c]),k)})},
  calc(x,w,h,k){const S=src('A',w,h);cop(x,w,h,S.d,C=>{const v=C[0]*.8+C[2]*.4;for(let c=0;c<3;c++)C[c]=lerp(C[c],v,k)})},
  selfcomp(x,w,h,k){const S=src('A',w,h);cop(x,w,h,S.d,C=>{for(let c=0;c<3;c++){const v=C[c]/255;C[c]=lerp(C[c],(1-(1-v)*(1-v))*255,k)}})},
  swap(x,w,h,k,t,p){const S=src('A',w,h);cop(x,w,h,S.d,C=>{const o=[C[p[0]],C[p[1]],C[p[2]]];for(let c=0;c<3;c++)C[c]=lerp(C[c],o[c],k)})},
  invert(x,w,h,k){const S=src('A',w,h);cop(x,w,h,S.d,C=>{for(let c=0;c<3;c++)C[c]=lerp(C[c],255-C[c],k)})},
  minimax(x,w,h,k){const S=src('A',w,h),r=Math.round(k*4*w/192),d=S.d.data,o=new Uint8ClampedArray(d);
    if(r>0){const t=new Uint8ClampedArray(d);for(let y=0;y<h;y++)for(let X=0;X<w;X++){const i=(y*w+X)*4;for(let c=0;c<3;c++){let m=0;for(let q=-r;q<=r;q++)m=Math.max(m,d[(y*w+clamp(X+q,0,w-1))*4+c]);t[i+c]=m}}
      for(let y=0;y<h;y++)for(let X=0;X<w;X++){const i=(y*w+X)*4;for(let c=0;c<3;c++){let m=0;for(let q=-r;q<=r;q++)m=Math.max(m,t[(clamp(y+q,0,h-1)*w+X)*4+c]);o[i+c]=m}}}
    putArr(x,w,h,o)},
  setmatte(x,w,h,k){const B=src('B',w,h).d.data;cop(x,w,h,src('A',w,h).d,(C,X,Y,i)=>{C[3]=lerp(255,lum(B[i],B[i+1],B[i+2])*1.6,k)})},
  solidcomp(x,w,h,k){x.clearRect(0,0,w,h);x.globalAlpha=k;x.fillStyle='#2b6cb0';x.fillRect(0,0,w,h);x.globalAlpha=1;x.drawImage(src('L',w,h).c,0,0)},
  // 色彩
  autolevels(x,w,h,k){const S=src('A',w,h);cop(x,w,h,S.d,C=>{C[0]=lerp(C[0],(C[0]-30)*1.35,k);C[1]=lerp(C[1],(C[1]-35)*1.3,k);C[2]=lerp(C[2],(C[2]-60)*1.45,k)})},
  contrast(x,w,h,k){const S=src('A',w,h);cop(x,w,h,S.d,C=>{for(let c=0;c<3;c++)C[c]=(C[c]-128)*(1+k*1.2)+128})},
  bw(x,w,h,k){const S=src('A',w,h);cop(x,w,h,S.d,C=>{const v=C[0]*.45+C[1]*.4+C[2]*.15;for(let c=0;c<3;c++)C[c]=lerp(C[c],v,k)})},
  brightcontrast(x,w,h,k){const S=src('A',w,h);cop(x,w,h,S.d,C=>{for(let c=0;c<3;c++)C[c]=(C[c]-128)*(1+k*.8)+128+k*28})},
  desat(x,w,h,k){const S=src('A',w,h);cop(x,w,h,S.d,C=>{const v=lum(C[0],C[1],C[2]);for(let c=0;c<3;c++)C[c]=lerp(C[c],v,k*.55)*(1-k*.12)})},
  neutral(x,w,h,k){const S=src('A',w,h);cop(x,w,h,S.d,C=>{C[0]=lerp(C[0]*1.1+20,C[0],k);C[2]=lerp(C[2]*.75,C[2],k);C[1]=lerp(C[1]*.95,C[1],k)})},
  offsetcolor(x,w,h,k,t){const S=src('A',w,h),M=hueMat(k*180);cop(x,w,h,S.d,C=>{const r=C[0];applyMat(C,M,1);C[0]=lerp(r,C[0],.5)})},
  tritone(x,w,h,k,t,p){const S=src('A',w,h),cols=p?['#2a1606','#a8673a','#f7e3bf']:['#1b1f4a','#c0583a','#ffe7b0'];
    cop(x,w,h,S.d,C=>{const v=lum(C[0],C[1],C[2])/255,o=grad3(v,...cols);for(let c=0;c<3;c++)C[c]=lerp(C[c],o[c],k)})},
  changecolor(x,w,h,k,t,p){const S=src('A',w,h),target=p===2?.6:.13,shift=p===1?.5:.33;
    cop(x,w,h,S.d,C=>{const[hh,s]=rgbHue(C[0],C[1],C[2]);if(hh<0||s<.4)return;let d=Math.abs(hh-target);d=Math.min(d,1-d);const m=(1-sstep(.04,.1,d))*k;
      if(m>0){const l=Math.max(C[0],C[1],C[2])/255*.55,o=hsl2rgb(hh+shift,.85,l);for(let c=0;c<3;c++)C[c]=lerp(C[c],o[c],m)}})},
  channelmix(x,w,h,k){const S=src('A',w,h);cop(x,w,h,S.d,C=>{const r=C[0],b=C[2];C[0]=lerp(r,b,k);C[2]=lerp(b,r,k)})},
  colorbalance(x,w,h,k){const S=src('A',w,h);cop(x,w,h,S.d,C=>{const v=lum(C[0],C[1],C[2])/255,sh=1-v,hi=v;C[0]+=k*(hi*40-sh*20);C[2]+=k*(sh*50-hi*40);C[1]+=k*hi*8})},
  hue(x,w,h,k,t,p){const S=src('A',w,h),M=hueMat(k*(p?300:120));cop(x,w,h,S.d,C=>applyMat(C,M,1))},

  caustics(x,w,h,k,t){const S=src('A',w,h);cop(x,w,h,S.d,(C,X,Y)=>{const u=X/w*6,v=Y/h*4;let c=Math.abs(Math.sin(u+Math.sin(v*1.3+t*TAU)+t*TAU)*Math.sin(v+Math.sin(u*1.1-t*TAU)));c=Math.pow(1-c,6);

  bubbles(x,w,h,k,t,p){if(p)x.drawImage(src('A',w,h).c,0,0);else bg(x,w,h,'#000');sc(x,w);const n=Math.floor(k*30);for(let i=0;i<n;i++){const r=(p?2:3)+rnd(i)*(p?4:7),px=rnd(i+3)*192+Math.sin(t*TAU*2+i)*4,py=fr(rnd(i+7)-t*(.6+rnd(i)*.6))*(108+r*2)-r;

  drizzle(x,w,h,k,t){const S=src('A',w,h),drops=[];for(let i=0;i<8;i++)drops.push([rnd(i)*w,rnd(i+11)*h,fr(t+rnd(i+20))]);

  hair(x,w,h,k,t){bg(x,w,h,'#000');const L=src('L',w,h);x.drawImage(L.c,0,0);const d=L.d.data;sc(x,w);x.lineCap='round';x.lineWidth=1;

      x.strokeStyle=`rgb(${d[ix]},${d[ix+1]},${d[ix+2]})`;x.beginPath();x.moveTo(px,py);x.quadraticCurveTo(px+Math.cos(a)*len*.5,py+Math.sin(a)*len*.5,px+Math.cos(a+.6)*len,py+Math.sin(a+.6)*len);x.stroke()}reset(x)},
  mercury(x,w,h,k,t){const S=src('A',w,h),n=Math.max(1,Math.round(k*7)),B=[];for(let i=0;i<n;i++)B.push([w*(.5+.38*Math.sin(t*TAU+i*1.7)),h*(.5+.36*Math.sin(t*TAU*2*(i%2?1:-1)+i)),(8+rnd(i)*8)*w/192]);

  particles(x,w,h,k,t,p){bg(x,w,h,'#000');sc(x,w);x.globalCompositeOperation='lighter';const n=Math.floor(k*160);
    for(let i=0;i<n;i++){const age=fr(t*1.3+rnd(i)),a=rnd(i+1)*TAU,v=20+rnd(i+2)*60;let px=96+Math.cos(a)*v*age,py=54+Math.sin(a)*v*age*(p===1?.5:1)+(p!==1?age*age*40:0);

  glass(x,w,h,k){const S=src('A',w,h),d=S.d.data,b=blurArr(d,w,h,2*w/192),L=(X,Y)=>{const i=(clamp(Y,0,h-1)*w+clamp(X,0,w-1))*4;return lum(b[i],b[i+1],b[i+2])};

// 搜尋/切換
let qt;$('#q').oninput=e=>{clearTimeout(qt);qt=setTimeout(()=>{state.q=e.target.value;buildList()},120)};
let zt,lastCVW=CVW;addEventListener('resize',()=>{clearTimeout(zt);zt=setTimeout(()=>{applyZoom();if(Math.abs(CVW-lastCVW)>=64){lastCVW=CVW;buildList()}window._catSync&&_catSync()},150)});
$('#hotBtn').onclick=()=>{state.hot=!state.hot;$('#hotBtn').classList.toggle('hoton',state.hot);state.cat='all';buildCats();$('#cats').scrollLeft=0;buildList();window._catSync&&_catSync()};
$('#autoBtn').onclick=()=>{state.auto=!state.auto;$('#autoBtn').classList.toggle('on',state.auto);$('#autoBtn').textContent=state.auto?'⏸ 停止播放':'▶ 自動播放';
  if(!state.auto)cards.forEach(c=>{if(c._vis)render(c._cv,c._fx,isTrans(c._fx)?.5:.75,.15)})};
document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==$('#q')){e.preventDefault();$('#q').focus()}
  if(modal.open){if(e.key==='Escape')closeModal();if(e.key==='ArrowRight')openModal(modal.i+1);if(e.key==='ArrowLeft')openModal(modal.i-1);if(e.key===' '){e.preventDefault();$('#mPlay').click()}}});
// 分類列：左右按鈕、拉桿、滑鼠滾輪
(()=>{const nav=$('#cats'),rg=$('#catRange'),L=$('#catL'),Rb=$('#catR');
  const max=()=>nav.scrollWidth-nav.clientWidth;
  const sync=()=>{const m=max();rg.classList.toggle('hide',m<=2);L.disabled=nav.scrollLeft<=1;Rb.disabled=nav.scrollLeft>=m-1;
    if(m>2){rg.value=Math.round(nav.scrollLeft/m*1000);rg.style.setProperty('--tw',Math.max(40,rg.clientWidth*nav.clientWidth/nav.scrollWidth)+'px')}};
  rg.addEventListener('input',()=>{nav.style.scrollBehavior='auto';nav.scrollLeft=rg.value/1000*max();nav.style.scrollBehavior=''});
  L.onclick=()=>{nav.scrollLeft-=nav.clientWidth*.7};Rb.onclick=()=>{nav.scrollLeft+=nav.clientWidth*.7};
  nav.addEventListener('scroll',sync);addEventListener('resize',sync);
  nav.addEventListener('wheel',e=>{if(max()>2&&Math.abs(e.deltaY)>Math.abs(e.deltaX)){nav.style.scrollBehavior='auto';nav.scrollLeft+=e.deltaY;nav.style.scrollBehavior='';e.preventDefault()}},{passive:false});
  window._catSync=sync;})();
saveFav();buildCats();buildList();_catSync();
</script>
</body>
</html>
